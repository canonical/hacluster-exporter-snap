name: Build Snap

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.rst"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build snap
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - [ubuntu-24.04]
          - [self-hosted, jammy, ARM64]
          - [self-hosted, linux, s390x]
          - [self-hosted, ppc64el]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build snap
        id: build
        uses: canonical/action-build@v1.3.0

      - name: Determine system architecture
        run: echo "SYSTEM_ARCH=$(uname -m)" >> "$GITHUB_ENV"

      - name: Upload built snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap_${{ env.SYSTEM_ARCH }}
          path: ${{ steps.build.outputs.snap }}
